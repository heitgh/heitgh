<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Moon Browser — Coming Soon</title>
  <desc id="desc">A premium lunar banner for Moon Browser, an open-source desktop browser in active development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/><stop offset=".5" stop-color="#111d46"/><stop offset="1" stop-color="#3b176a"/>
    </linearGradient>
    <radialGradient id="planet" cx="32%" cy="28%" r="74%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".44" stop-color="#e0e7ff"/><stop offset="1" stop-color="#6d5bd0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".48" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="427" rx="26.5" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="3"/>
  <g fill="#e0f2fe" opacity=".85">
    <circle cx="78" cy="68" r="2"/><circle cx="186" cy="40" r="1.5"/><circle cx="340" cy="78" r="2"/>
    <circle cx="485" cy="44" r="1.5"/><circle cx="714" cy="72" r="2"/><circle cx="1118" cy="78" r="1.5"/>
    <circle cx="1050" cy="356" r="2"/><circle cx="640" cy="374" r="1.5"/><circle cx="114" cy="358" r="1.5"/>
  </g>
  <circle cx="940" cy="224" r="142" fill="#7c3aed" opacity=".22" filter="url(#glow)"/>
  <circle cx="940" cy="224" r="112" fill="url(#planet)"/>
  <circle cx="903" cy="181" r="18" fill="#4338ca" opacity=".22"/><circle cx="979" cy="250" r="25" fill="#312e81" opacity=".20"/>
  <circle cx="966" cy="162" r="11" fill="#2563eb" opacity=".20"/>
  <path d="M1001 125 A119 119 0 0 1 996 324 A111 111 0 0 0 939 112Z" fill="#020617" opacity=".62"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="62" width="242" height="48" rx="24" fill="#0e7490" opacity=".95"/>
    <text x="191" y="94" text-anchor="middle" font-size="20" font-weight="750" letter-spacing="3" fill="#ecfeff">COMING SOON</text>
    <text x="70" y="205" font-size="76" font-weight="760" fill="#f8fafc">Moon Browser</text>
    <text x="70" y="258" font-size="30" font-weight="500" fill="#cbd5e1">A browser designed to adapt to people.</text>
    <rect x="70" y="304" width="136" height="42" rx="21" fill="#172554" stroke="#3b82f6"/>
    <rect x="220" y="304" width="170" height="42" rx="21" fill="#2e1065" stroke="#8b5cf6"/>
    <rect x="404" y="304" width="144" height="42" rx="21" fill="#083344" stroke="#22d3ee"/>
    <text x="138" y="331" text-anchor="middle" font-size="17" font-weight="600" fill="#dbeafe">ERGONOMIC</text>
    <text x="305" y="331" text-anchor="middle" font-size="17" font-weight="600" fill="#ede9fe">CONTEXTUAL</text>
    <text x="476" y="331" text-anchor="middle" font-size="17" font-weight="600" fill="#cffafe">USER-FIRST</text>
    <text x="70" y="390" font-size="18" font-weight="500" letter-spacing="2" fill="#94a3b8">OPEN SOURCE · ACTIVE DEVELOPMENT</text>
  </g>
</svg>
